openapi: 3.2.0
info:
  title: Game Database
  version: 1.0.0
  description: A simple Spring Boot 4 REST API for managing game metadata using Spring Data JPA and an H2 database
paths:
  /api/games:
    summary: Get all games
    description: Returns all of the games stored in the Database
    get:
      tags:
        - games
      summary:  Gets all games
      description:  Retrieve all games stored in the Database
      operationId: getAllGames
      responses:
        '200':
          content:
            application/json:
              examples:
                "All Games":
                  value: 
                    [{"genre":"Adventure","id":1,"platform":"Nintendo Switch","releaseYear":"2017","title":"The Legend of Zelda: Breath of the Wild"},{"genre":"Action RPG","id":2,"platform":"PlayStation 5","releaseYear":"2022","title":"Elden Ring"},{"genre":"Action RPG","id":3,"platform":"PC","releaseYear":"2020","title":"Cyberpunk 2077"},{"genre":"Roguelike","id":4,"platform":"Nintendo Switch","releaseYear":"2020","title":"Hades"},{"genre":"Metroidvania","id":5,"platform":"PC","releaseYear":"2017","title":"Hollow Knight"},{"genre":"Simulation","id":6,"platform":"PC","releaseYear":"2016","title":"Stardew Valley"},{"genre":"Sandbox","id":7,"platform":"Multi-Platform","releaseYear":"2011","title":"Minecraft"},{"genre":"Action RPG","id":8,"platform":"PC","releaseYear":"2015","title":"The Witcher 3: Wild Hunt"},{"genre":"Adventure","id":9,"platform":"PlayStation 5","releaseYear":"2022","title":"God of War Ragnarök"},{"genre":"Platformer","id":10,"platform":"Nintendo Switch","releaseYear":"2023","title":"Super Mario Bros. Wonder"}]
          description: Success
    post:
      tags:
        - games
      summary: Creates a new game.
      description: |-
        Creates a new game.  The following validations must be met for the game to be added.
        - All fields must be filled out
        - Genre must be one of the following
            - Action RPG
            - Adventure
            - Metroidvania
            - Platformer
            - Roguelike
            - Simulation
            - Sandbox
            - Puzzle
        - Platform must be one of the following
            - PC
            - PlayStation 5
            - Nintendo Switch
            - Multi-Platform
        - Year must be 4 digits
      operationId: createNewGame
      requestBody:
        required: true
        description: A new game object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Game'
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                Game:
                  value:
                    {"id":11,"title": "Tetris","genre":"Puzzle","platform": "Nintendo Switch","releaseYear": "1989"}
        '400':
          description: Invalid request body, invalid genre, invalid platform, invalid release year, or missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                MissingRequiredFields:
                  value: 
                    {"status":"400 BAD_REQUEST","message":"All fields (title, genre, platform, releaseYear) are required.","errors":["Request body is not valid."]}
                InvalidReleaseYear:
                  value:
                    {"status":"400 BAD_REQUEST","message":"Release year must be a valid four-digit year.","errors":["Request body is not valid."]}
                MalformedJson:
                  value:
                    {"status":"400 BAD_REQUEST","message":"JSON parse error: Cannot deserialize value","errors":["HTTP message was not readable."]}
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                MethodNotAllowed:
                  value:
                    {"status":"405 METHOD_NOT_ALLOWED","message":"Request method 'PUT' is not supported","errors":["PUT method is not supported for this request.  Supported methods are GET POST "]}
                    
                
  /api/games/{id}:
    summary: Game identified by id
    description: Retrieves game identified by id for further operations
    get:
      tags:
        - games
      summary: Gets a single game
      description:  Gets the game stored in the database identified by id
      operationId: getGameById
      parameters:
        - name: id
          in: path
          description: The id of the game
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                Game:
                  value:
                    {"genre":"Adventure","id":1,"platform":"Nintendo Switch","releaseYear":"2017","title":"The Legend of Zelda: Breath of the Wild"}
          description: Success
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                GameNotFound:
                  value:
                    {"status":"400 BAD_REQUEST","message":"Game id not found in database.","errors":["Request body is not valid."]}
          description: Game not found
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                MethodNotAllowed:
                  value:
                    {"status":"405 METHOD_NOT_ALLOWED","message":"Request method 'POST' is not supported","errors":["POST method is not supported for this request.  Supported methods are GET PUT DELETE "]}
    put:
      tags:
        - games
      summary: Update a game
      description: |-
        Updates an existing game.  Partial updates are supported.  Only non-null fields are applied.  If Genre, Platform, or Year are specified, the following validations must be met for the update to occur:
        - Genre must be one of the following
            - Action RPG
            - Adventure
            - Metroidvania
            - Platformer
            - Roguelike
            - Simulation
            - Sandbox
            - Puzzle
        - Platform must be one of the following
            - PC
            - PlayStation 5
            - Nintendo Switch
            - Multi-Platform
        - Year must be 4 digits
      operationId: updateGame
      parameters:
        - name: id
          in: path
          description: The id of the game
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: A new game object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Game'
            examples:
              Update:
                value:
                  {"releaseYear": "2026","platform": "PlayStation 5"}
      responses:
        '400':
          description: Invalid request body, invalid genre, invalid platform, invalid release year, or game not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                GameNotFound:
                  value:
                    {"status":"400 BAD_REQUEST","message":"Game id not found in database.","errors":["Request body is not valid."]}
                InvalidReleaseYear:
                  value: 
                    {"status":"400 BAD_REQUEST","message":"Release year must be a valid four-digit year.","errors":["Request body is not valid."]}
                MalformedJson:
                  value:
                    {"status":"400 BAD_REQUEST","message":"JSON parse error: Cannot deserialize value","errors":["HTTP message was not readable."]}
        '200':
          description: Success
          content:
            application/json:
              examples:
                Game:
                  value:
                    {"genre": "Puzzle","id": 11,"platform": "PlayStation 5","releaseYear": "2026","title": "Tetris"}
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                MethodNotAllowed:
                  value:
                    {"status":"405 METHOD_NOT_ALLOWED","message":"Request method 'POST' is not supported","errors":["POST method is not supported for this request.  Supported methods are GET PUT DELETE "]}
    delete:
      tags:
        - games
      summary: Delete a game
      description: Deletes the game identified by the provided id
      operationId: deleteGame
      parameters:
        - name: id
          in: path
          description: The id of the game
          required: true
          schema:
            type: string
      responses:
        '400':
          description: Game not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                GameNotFound:
                  value:
                    {"status":"400 BAD_REQUEST","message":"Game id not found in database.","errors":["Request body is not valid."]}
        '200':
          description: Success
          content:
            application/json:
              examples:
                Game:
                  value:
                    {"genre": "Puzzle","id": 11,"platform": "PlayStation 5","releaseYear": "2026","title": "Tetris"}
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                MethodNotAllowed:
                  value:
                    {"status":"405 METHOD_NOT_ALLOWED","message":"Request method 'POST' is not supported","errors":["POST method is not supported for this request.  Supported methods are GET PUT DELETE "]}
components:
  schemas:
    Game:
      type: object
      properties:
        title:
          type: string
          description: The name of the game
          examples: ["Tetris"]
        genre:
          type: string
          description: Game genre.
          examples: ["Puzzle"]
          enum:
            - Action RPG
            - Adventure
            - Metroidvania
            - Platformer
            - Roguelike
            - Simulation
            - Sandbox
            - Puzzle
        platform:
          type: string
          description: The platform the game resides on.  
          examples: ["Nintendo Switch"]
          enum:
            - PC
            - PlayStation 5
            - Nintendo Switch
            - Multi-Platform
        releaseYear:
          type: string
          description: The year the game was released.  Must be four digits.
          examples: ["1989"]
    ApiError:
      type: object
      description: Standard error response returned by the global exception handler.
      properties:
        status:
          type: string
          description: HTTP status code and reason phrase.
          examples: ["400 BAD_REQUEST"]
        message:
          type: string
          description: Primary error message.
          examples: ["Release year must be a valid four-digit year."]
        errors:
          type: array
          description: Additional error details.
          items:
            type: string
          examples:
            - ["Request body is not valid."]
